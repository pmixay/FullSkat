name: Build watch APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK (Wear OS)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner's bundled sdkmanager is too old to see API 37 packages: fetch the current
      # command-line tools straight from Google and install the platform with those.
      - name: Install Android SDK platform 37
        run: |
          set -e
          SDK="$ANDROID_HOME"
          TOOLS="$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$TOOLS"
          curl -sSL -o "$RUNNER_TEMP/cmdtools.zip" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$TOOLS"
          SDKMANAGER="$TOOLS/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # MIT-licensed actions/cache wrapper, free for all repositories
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Optional release signing. Add the secrets below to sign with your own key;
      # without them the APK is signed with the debug key and still installs on a watch.
      - name: Prepare signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.FULLSKAT_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FULLSKAT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # Renders the real screens on the JVM (Robolectric) for review; never blocks the APK.
      - name: Screenshots
        if: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --tests 'com.fullskat.watch.ScreenshotTest' --tests 'com.fullskat.watch.RichTextScreenshotTest' -Pscreenshots --no-daemon --console=plain

      - uses: actions/upload-artifact@v7
        if: ${{ always() && startsWith(github.ref, 'refs/heads/claude/') }}
        with:
          name: fullskat-screenshots
          path: app/build/screenshots
          if-no-files-found: warn
          retention-days: 3

      - name: Build
        env:
          FULLSKAT_KEYSTORE_PASSWORD: ${{ secrets.FULLSKAT_KEYSTORE_PASSWORD }}
          FULLSKAT_KEY_ALIAS: ${{ secrets.FULLSKAT_KEY_ALIAS }}
          FULLSKAT_KEY_PASSWORD: ${{ secrets.FULLSKAT_KEY_PASSWORD }}
          FULLSKAT_VERSION_CODE: ${{ github.run_number }}
          FULLSKAT_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Collect APK
        id: apk
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out
          cp "$apk" out/fullskat-watch.apk
          echo "size=$(du -h out/fullskat-watch.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      # The artifact is one zip archive containing only fullskat-watch.apk, compressed at level 9.
      - uses: actions/upload-artifact@v7
        with:
          name: fullskat-watch-apk
          path: out/fullskat-watch.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Summary
        run: echo "APK built (${{ steps.apk.outputs.size }}). Download the fullskat-watch-apk artifact; the zip contains only fullskat-watch.apk." >> "$GITHUB_STEP_SUMMARY"

  server-tests:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
