[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullskat-server"
version = "0.1.0"
description = "Server for FullSkat, a phone and Wear OS assistant: accounts, sync, attachments and a streaming chat relay across model providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "anthropic>=1.1",
    "pydantic-settings>=2.2",
    "pillow>=10.1",
]

[project.optional-dependencies]
# HEIC/HEIF uploads (phone photos); without it such uploads are answered with 415.
heic = [
    "pillow-heif>=0.18",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4",
    "pillow-heif>=0.18",
]

[project.scripts]
fullskat-server = "fullskat_server.__main__:main"

[tool.setuptools.packages.find]
include = ["fullskat_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
