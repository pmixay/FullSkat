<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=216,initial-scale=1"><title>Paper limit</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:216px;height:216px;overflow:hidden;background:#000}
body{font-family:Roboto,"Google Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.scr{position:relative;width:216px;height:216px;overflow:hidden}
.ab{position:absolute}
.ic{display:block;flex:none}
.row{display:flex;align-items:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.scr{color:#F2E9DD}
.serif{font-family:"Noto Serif","Bitstream Charter",Georgia,serif}
.time{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#BFB2A1;font-family:"Noto Serif","Bitstream Charter",Georgia,serif}
.disc{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.list{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:6px}
.card{border-radius:26px;background:#1E1914;width:100%}
.r{height:50px;display:flex;align-items:center;gap:10px;padding:0 14px 0 9px;width:100%}
.t1{font-size:14px;line-height:18px;font-family:"Noto Serif","Bitstream Charter",Georgia,serif}
.t2{font-size:11px;color:#BFB2A1;line-height:14px}
.ubub{font-size:14px;line-height:19px;padding:7px 12px;border-radius:19px 19px 6px 19px;background:#3A2A1F;color:#F8DCC6;width:max-content}
.ans{font-size:14px;line-height:20px;color:#F2E9DD}
.li{display:flex;gap:8px;align-items:baseline;margin-top:2px}
.bul{flex:none;width:6px;height:6px;border-radius:50%;background:#A9CBA2;transform:translateY(-2px)}
code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#EAD28C;background:#2F2918;border-radius:7px;padding:0 5px}
.sw{width:32px;height:20px;border-radius:10px;position:relative;flex:none}
.sw i{position:absolute;top:3px;width:14px;height:14px;border-radius:50%}
</style></head><body style="background:#0B0907"><div class="scr"><div class="list" style="top:26px;gap:7px;opacity:.25"><div class="ubub" data-fit="6" data-r="14" data-al="e" data-min="60">Что такое бозон Хиггса?</div>
<div class="ans" style="padding:0 26px 0 30px">Это частица, которая придаёт массу другим</div></div>
<div class="ab" style="left:22px;top:50px;width:172px;height:142px;border-radius:40px;background:#2A1712;border:1px solid #E7866F55;display:flex;flex-direction:column;align-items:center;padding-top:13px;text-align:center">
  <div class="disc" style="width:38px;height:38px;background:#E7866F"><svg class="ic" width="21" height="21" viewBox="0 0 24 24" ><path d="M5.5 5.5h13A1.5 1.5 0 0 1 20 7v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V7a1.5 1.5 0 0 1 1.5-1.5z" fill="#2A1208" stroke="#2A1208" stroke-width="1.2" stroke-linejoin="miter"/><path d="M4 10h16M9 14l6 4M15 14l-6 4" fill="none" stroke="#E7866F" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter"/><path d="M8 3v4M16 3v4" fill="none" stroke="#2A1208" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/></svg></div>
  <div class="serif" style="font-size:16px;margin-top:6px;color:#FBE3D8">Daily limit</div>
  <div style="font-size:11.5px;color:#D9B7A9;line-height:15px;margin-top:2px;padding:0 16px">Today’s messages are used up</div>
  <div class="row" style="margin-top:7px;gap:5px;font-size:12px;color:#EAD28C"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" ><path d="M12 5.5a8 8 0 1 1 0 16a8 8 0 1 1 0 -16z" fill="#EAD28C" fill-opacity=".30" stroke="none"/><path d="M12 5.5a8 8 0 1 1 0 16a8 8 0 1 1 0 -16z" fill="none" stroke="#EAD28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9.5v4l2.6 2.6" fill="none" stroke="#EAD28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 2.5h5" fill="none" stroke="#EAD28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>back in 6 h</div>
</div></div><script>
(function(){
  var C=108;
  function chord(top,bot,m,r){
    var yf=Math.max(Math.abs(top-C),Math.abs(bot-C));
    var ins=0.3*r; yf=Math.max(0,yf-ins);
    var R=C-m; if(yf>=R) return 0; return 2*Math.sqrt(R*R-yf*yf)+2*ins;
  }
  document.querySelectorAll('[data-fit]').forEach(function(el){
    var m=+el.dataset.fit||0, r=+(el.dataset.r||0), al=el.dataset.al||'c', minW=+(el.dataset.min||120), s=1;
    for(var k=0;k<3;k++){
      el.style.maxWidth='';
      var b=el.getBoundingClientRect(), w=chord(b.top,b.bottom,m,r);
      if(w<minW){s=Math.max(.5,w/Math.min(b.width,176)); w=Math.min(b.width,176);} else s=1;
      el.style.maxWidth=Math.floor(w)+'px';
    }
    var b=el.getBoundingClientRect(), w=Math.max(minW,chord(b.top,b.bottom,m,r)), x;
    if(al==='e') x=C+w/2-b.width; else if(al==='s') x=C-w/2; else x=C-b.width/2;
    if(s<1){x=C-b.width/2; el.style.opacity=(0.25+0.75*s).toFixed(2);}
    el.style.transform='translateX('+(x-b.left)+'px)'+(s<1?' scale('+s.toFixed(3)+')':'');
  });
})();
</script></body></html>
