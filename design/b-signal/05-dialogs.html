<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=216,initial-scale=1"><title>Signal dialogs</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:216px;height:216px;overflow:hidden;background:#000}
body{font-family:Roboto,"Google Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.scr{position:relative;width:216px;height:216px;overflow:hidden}
.ab{position:absolute}
.ic{display:block;flex:none}
.row{display:flex;align-items:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.scr{color:#FFFFFF;font-feature-settings:"tnum"}
.time{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:#FFFFFF}
.tile{display:flex;align-items:center;justify-content:center;flex:none}
.list{position:absolute;left:0;right:0;display:flex;flex-direction:column}
.r{height:44px;display:flex;align-items:center;gap:9px;padding:0 10px 0 8px;width:100%;border-bottom:1px solid #2C2C2C}
.t1{font-size:13.5px;font-weight:600;line-height:17px}
.t2{font-size:11px;color:#B3B3B3;line-height:14px;font-weight:500}
.mono{font-family:"JetBrains Mono",monospace}
.ubub{font-size:14px;line-height:18px;font-weight:600;padding:6px 10px;border-radius:10px 10px 2px 10px;background:#FFD60A;color:#000;width:max-content}
.ans{font-size:14px;line-height:19px}
.li{display:flex;gap:7px;align-items:baseline;margin-top:2px}
.sq{flex:none;width:7px;height:7px;background:#40C8FF;transform:translateY(-1px)}
code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#FF4FA3;background:#2A0E1D;border-radius:3px;padding:0 3px;font-weight:600}
.tab{position:absolute;bottom:0;left:78px;width:60px;height:30px;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:5px}
.key{width:34px;height:34px;border-radius:9px;background:#242424;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.sw{width:30px;height:18px;border-radius:5px;position:relative;flex:none}
.sw i{position:absolute;top:3px;width:12px;height:12px;border-radius:3px;background:#000}
</style></head><body style="background:#000"><div class="scr">
<div class="ab" style="left:93px;top:10px"><div class="tile" style="width:30px;height:30px;border-radius:8px;background:#30D158"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" ><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V17h-.5A2.5 2.5 0 0 1 4 14.5z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="miter"/><path d="M12 7.5v6M9 10.5h6" fill="none" stroke="#30D158" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter"/></svg></div></div>
<div class="list" style="top:44px">
  <div class="r" data-fit="8" data-min="110"><div class="tile" style="width:26px;height:26px;border-radius:7px;background:#30D158"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" ><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V17h-.5A2.5 2.5 0 0 1 4 14.5z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="miter"/><path d="M8.5 9h7M8.5 12.5h4.5" fill="none" stroke="#30D158" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter"/></svg></div><div style="flex:1;min-width:0"><div class="t1 ell">Как сварить гречку</div><div class="t2 mono" style="font-size:10px">2m</div></div></div>
  <div class="r" data-fit="8" data-min="110"><div class="tile" style="width:26px;height:26px;border-radius:7px;background:#FF4FA3"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" ><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/><path d="M13.2 5.5l-2.4 13" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/></svg></div><div style="flex:1;min-width:0"><div class="t1 ell">Regex для e-mail</div><div class="t2 mono" style="font-size:10px">1h</div></div></div>
  <div class="r" data-fit="8" data-min="110"><div class="tile" style="width:26px;height:26px;border-radius:7px;background:#FF9F0A"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" ><path d="M17.5 5H6.5l6 7-6 7h11" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/></svg></div><div style="flex:1;min-width:0"><div class="t1 ell">Интеграл x·eˣ</div><div class="t2 mono" style="font-size:10px">Mon</div></div></div>
  <div class="r" data-fit="8" data-min="110"><div class="tile" style="width:26px;height:26px;border-radius:7px;background:#40C8FF"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" ><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="miter"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" fill="none" stroke="#40C8FF" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter"/></svg></div><div style="flex:1;min-width:0"><div class="t1 ell">Погода в Риге</div><div class="t2 mono" style="font-size:10px">Sun</div></div></div>
</div>
</div><script>
(function(){
  var C=108;
  function chord(top,bot,m,r){
    var yf=Math.max(Math.abs(top-C),Math.abs(bot-C));
    var ins=0.3*r; yf=Math.max(0,yf-ins);
    var R=C-m; if(yf>=R) return 0; return 2*Math.sqrt(R*R-yf*yf)+2*ins;
  }
  document.querySelectorAll('[data-fit]').forEach(function(el){
    var m=+el.dataset.fit||0, r=+(el.dataset.r||0), al=el.dataset.al||'c', minW=+(el.dataset.min||120), s=1;
    for(var k=0;k<3;k++){
      el.style.maxWidth='';
      var b=el.getBoundingClientRect(), w=chord(b.top,b.bottom,m,r);
      if(w<minW){s=Math.max(.5,w/Math.min(b.width,176)); w=Math.min(b.width,176);} else s=1;
      el.style.maxWidth=Math.floor(w)+'px';
    }
    var b=el.getBoundingClientRect(), w=Math.max(minW,chord(b.top,b.bottom,m,r)), x;
    if(al==='e') x=C+w/2-b.width; else if(al==='s') x=C-w/2; else x=C-b.width/2;
    if(s<1){x=C-b.width/2; el.style.opacity=(0.25+0.75*s).toFixed(2);}
    el.style.transform='translateX('+(x-b.left)+'px)'+(s<1?' scale('+s.toFixed(3)+')':'');
  });
})();
</script></body></html>
