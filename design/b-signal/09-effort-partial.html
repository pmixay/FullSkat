<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=216,initial-scale=1"><title>Signal effort</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:216px;height:216px;overflow:hidden;background:#000}
body{font-family:Roboto,"Google Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.scr{position:relative;width:216px;height:216px;overflow:hidden}
.ab{position:absolute}
.ic{display:block;flex:none}
.row{display:flex;align-items:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.scr{color:#FFFFFF;font-feature-settings:"tnum"}
.time{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:#FFFFFF}
.tile{display:flex;align-items:center;justify-content:center;flex:none}
.list{position:absolute;left:0;right:0;display:flex;flex-direction:column}
.r{height:44px;display:flex;align-items:center;gap:9px;padding:0 10px 0 8px;width:100%;border-bottom:1px solid #2C2C2C}
.t1{font-size:13.5px;font-weight:600;line-height:17px}
.t2{font-size:11px;color:#B3B3B3;line-height:14px;font-weight:500}
.mono{font-family:"JetBrains Mono",monospace}
.ubub{font-size:14px;line-height:18px;font-weight:600;padding:6px 10px;border-radius:10px 10px 2px 10px;background:#FFD60A;color:#000;width:max-content}
.ans{font-size:14px;line-height:19px}
.li{display:flex;gap:7px;align-items:baseline;margin-top:2px}
.sq{flex:none;width:7px;height:7px;background:#40C8FF;transform:translateY(-1px)}
code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#FF4FA3;background:#2A0E1D;border-radius:3px;padding:0 3px;font-weight:600}
.tab{position:absolute;bottom:0;left:78px;width:60px;height:30px;border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:5px}
.key{width:34px;height:34px;border-radius:9px;background:#242424;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.sw{width:30px;height:18px;border-radius:5px;position:relative;flex:none}
.sw i{position:absolute;top:3px;width:12px;height:12px;border-radius:3px;background:#000}
</style></head><body style="background:#000"><div class="scr">
<div class="ab" style="left:98px;top:36px"><div class="tile" style="width:20px;height:20px;border-radius:5px;background:#FF9F0A"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" ><path d="M13.5 2.5L5 13.5h6l-1 8 8.5-11h-6z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="miter"/></svg></div></div>
<div class="ab" style="left:38px;top:66px;width:140px;display:grid;grid-template-columns:1fr 1fr;gap:5px"><div class="row" style="background:#FF9F0A;color:#000;height:42px;border-radius:9px;padding:0 6px 0 7px;gap:6px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" ><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="miter"/><path d="M8.3 16l3.7-8.5 3.7 8.5M9.6 13.2h4.8" fill="none" stroke="#FF9F0A" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter"/></svg><div style="white-space:nowrap"><div style="font-size:12.5px;font-weight:800;line-height:14px">Auto</div><div style="font-size:10px;font-weight:700;opacity:.8">High</div></div></div><div class="row" style="background:#242424;color:#FFFFFF;height:42px;border-radius:9px;padding:0 6px 0 7px;gap:6px"><span class="row" style="gap:1.5px;align-items:flex-end;height:16px"><i style="width:3px;height:4px;background:#FF9F0A"></i><i style="width:3px;height:7px;background:#4A4A4A"></i><i style="width:3px;height:10px;background:#4A4A4A"></i><i style="width:3px;height:13px;background:#4A4A4A"></i><i style="width:3px;height:16px;background:#4A4A4A"></i></span><div style="white-space:nowrap"><div style="font-size:12.5px;font-weight:800;line-height:14px">Low</div></div></div><div class="row" style="background:#242424;color:#FFFFFF;height:42px;border-radius:9px;padding:0 6px 0 7px;gap:6px"><span class="row" style="gap:1.5px;align-items:flex-end;height:16px"><i style="width:3px;height:4px;background:#FF9F0A"></i><i style="width:3px;height:7px;background:#FF9F0A"></i><i style="width:3px;height:10px;background:#FF9F0A"></i><i style="width:3px;height:13px;background:#4A4A4A"></i><i style="width:3px;height:16px;background:#4A4A4A"></i></span><div style="white-space:nowrap"><div style="font-size:12.5px;font-weight:800;line-height:14px">High</div></div></div><div class="row" style="background:#242424;color:#FFFFFF;height:42px;border-radius:9px;padding:0 6px 0 7px;gap:6px"><span class="row" style="gap:1.5px;align-items:flex-end;height:16px"><i style="width:3px;height:4px;background:#FF9F0A"></i><i style="width:3px;height:7px;background:#FF9F0A"></i><i style="width:3px;height:10px;background:#FF9F0A"></i><i style="width:3px;height:13px;background:#FF9F0A"></i><i style="width:3px;height:16px;background:#FF9F0A"></i></span><div style="white-space:nowrap"><div style="font-size:12.5px;font-weight:800;line-height:14px">Max</div></div></div></div></div><script>
(function(){
  var C=108;
  function chord(top,bot,m,r){
    var yf=Math.max(Math.abs(top-C),Math.abs(bot-C));
    var ins=0.3*r; yf=Math.max(0,yf-ins);
    var R=C-m; if(yf>=R) return 0; return 2*Math.sqrt(R*R-yf*yf)+2*ins;
  }
  document.querySelectorAll('[data-fit]').forEach(function(el){
    var m=+el.dataset.fit||0, r=+(el.dataset.r||0), al=el.dataset.al||'c', minW=+(el.dataset.min||120), s=1;
    for(var k=0;k<3;k++){
      el.style.maxWidth='';
      var b=el.getBoundingClientRect(), w=chord(b.top,b.bottom,m,r);
      if(w<minW){s=Math.max(.5,w/Math.min(b.width,176)); w=Math.min(b.width,176);} else s=1;
      el.style.maxWidth=Math.floor(w)+'px';
    }
    var b=el.getBoundingClientRect(), w=Math.max(minW,chord(b.top,b.bottom,m,r)), x;
    if(al==='e') x=C+w/2-b.width; else if(al==='s') x=C-w/2; else x=C-b.width/2;
    if(s<1){x=C-b.width/2; el.style.opacity=(0.25+0.75*s).toFixed(2);}
    el.style.transform='translateX('+(x-b.left)+'px)'+(s<1?' scale('+s.toFixed(3)+')':'');
  });
})();
</script></body></html>
