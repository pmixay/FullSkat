<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=216,initial-scale=1"><title>Aurora settings</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:216px;height:216px;overflow:hidden;background:#000}
body{font-family:Roboto,"Google Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.scr{position:relative;width:216px;height:216px;overflow:hidden}
.ab{position:absolute}
.ic{display:block;flex:none}
.row{display:flex;align-items:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

:root{--tx:#F3F4FF;--sub:#A7ACD0;--s1:#0E1022;--s2:#171A33;--line:rgba(170,180,255,.13);
--grad:linear-gradient(135deg,#7B61FF 0%,#3FD9F2 58%,#4DF0B4 100%)}
.scr{color:var(--tx)}
.time{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:.3px}
.gbtn{background:var(--grad);color:#090A1C;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(80,150,255,.55),0 0 2px rgba(255,255,255,.4) inset}
.tbtn{border-radius:50%;display:flex;align-items:center;justify-content:center}
.pill{border-radius:999px;background:var(--s1);border:1px solid var(--line)}
.list{position:absolute;left:0;right:0;display:flex;flex-direction:column;gap:4px}
.item{height:44px;border-radius:22px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;padding:0 12px 0 7px;gap:8px;width:100%}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.t1{font-size:13.5px;font-weight:500;line-height:17px}
.t2{font-size:11px;color:var(--sub);line-height:14px}
.ubub{font-size:14px;line-height:19px;padding:6px 11px;border-radius:17px 17px 5px 17px;
  background:linear-gradient(135deg,rgba(123,97,255,.42),rgba(63,217,242,.22));border:1px solid rgba(154,139,255,.45);width:max-content}
.think{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 7px;border-radius:12px;background:rgba(255,198,92,.10);border:1px solid rgba(255,198,92,.28);width:max-content;font-size:11px;color:#E9D3A8}
.ans{font-size:14px;line-height:19px;color:var(--tx)}
.li{display:flex;gap:7px;align-items:flex-start;margin-top:3px}
.num{flex:none;width:16px;height:16px;margin-top:1.5px;border-radius:50%;background:var(--grad);color:#090A1C;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#9FF3FF;background:rgba(63,217,242,.14);border-radius:5px;padding:0 4px}
.half{position:absolute;bottom:0;left:80px;width:56px;height:30px;border-radius:30px 30px 0 0;display:flex;justify-content:center;padding-top:5px}
.bezel{position:absolute;inset:0;border-radius:50%}
</style></head><body style="background:#000"><div class="scr">
<div class="list" style="top:30px">
  <div class="row" data-fit="9" data-r="22" style="gap:5px;width:100%"><div class="row" style="flex:1;height:44px;border-radius:22px;background:#3FD9F22E;border:1px solid #3FD9F2;box-shadow:0 0 12px #3FD9F255;justify-content:center;gap:6px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" ><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" fill="none" stroke="#3FD9F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" fill="none" stroke="#3FD9F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="width:26px;height:16px;border-radius:8px;background:#3FD9F2;position:relative"><div style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#090A1C"></div></div></div><div class="row" style="flex:1;height:44px;border-radius:22px;background:var(--s1);border:1px solid var(--line);justify-content:center;gap:6px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" ><path d="M9 5h6a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 15 19H9a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 9 5z" fill="none" stroke="#FF71B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 8.5v7M19.5 8.5v7M1.8 10.5v3M22.2 10.5v3" fill="none" stroke="#FF71B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><div style="width:26px;height:16px;border-radius:8px;background:#FF71B8;position:relative"><div style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#090A1C"></div></div></div></div>
  <div class="item" data-fit="9" data-r="22"><div class="dot" style="background:#4DF0B422"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" ><path d="M12 3.5a8.5 8.5 0 1 1 0 17.0a8.5 8.5 0 1 1 0 -17.0z" fill="none" stroke="#4DF0B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 10.5v3M12 8.5v7M15.5 10.5v3" fill="none" stroke="#4DF0B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="flex:1;min-width:0"><div class="t1 ell">Assistant</div></div><svg class="ic" width="16" height="16" viewBox="0 0 24 24" ><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#4DF0B4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="item" data-fit="9" data-r="22"><div class="dot" style="background:#7FB2FF22"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" ><path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 8.6a4.5 4.5 0 0 1-.3 9.9z" fill="none" stroke="#7FB2FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="flex:1;min-width:0"><div class="t1 ell">skat.arbuz.lol</div></div><svg class="ic" width="17" height="17" viewBox="0 0 24 24" ><path d="M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14" fill="none" stroke="#FF6B86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 8l-4 4 4 4" fill="none" stroke="#FF6B86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 12h9" fill="none" stroke="#FF6B86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="row" style="justify-content:center;gap:5px;height:26px;color:var(--sub);font-size:11px"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" ><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" fill="none" stroke="#A7ACD0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 11v5.5M12 7.6v.3" fill="none" stroke="#A7ACD0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>1.8.0</div>
</div>
</div><script>
(function(){
  var C=108;
  function chord(top,bot,m,r){
    var yf=Math.max(Math.abs(top-C),Math.abs(bot-C));
    var ins=0.3*r; yf=Math.max(0,yf-ins);
    var R=C-m; if(yf>=R) return 0; return 2*Math.sqrt(R*R-yf*yf)+2*ins;
  }
  document.querySelectorAll('[data-fit]').forEach(function(el){
    var m=+el.dataset.fit||0, r=+(el.dataset.r||0), al=el.dataset.al||'c', minW=+(el.dataset.min||120), s=1;
    for(var k=0;k<3;k++){
      el.style.maxWidth='';
      var b=el.getBoundingClientRect(), w=chord(b.top,b.bottom,m,r);
      if(w<minW){s=Math.max(.5,w/Math.min(b.width,176)); w=Math.min(b.width,176);} else s=1;
      el.style.maxWidth=Math.floor(w)+'px';
    }
    var b=el.getBoundingClientRect(), w=Math.max(minW,chord(b.top,b.bottom,m,r)), x;
    if(al==='e') x=C+w/2-b.width; else if(al==='s') x=C-w/2; else x=C-b.width/2;
    if(s<1){x=C-b.width/2; el.style.opacity=(0.25+0.75*s).toFixed(2);}
    el.style.transform='translateX('+(x-b.left)+'px)'+(s<1?' scale('+s.toFixed(3)+')':'');
  });
})();
</script></body></html>
